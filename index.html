<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>😏 Gizli Soru</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Poppins", sans-serif;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(255, 255, 255, 0.8),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 85% 15%,
                    rgba(255, 174, 204, 0.7),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 15% 90%,
                    rgba(255, 214, 229, 0.85),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(219, 176, 243, 0.65),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #ffdce9 0%,
                    #f8c9de 45%,
                    #efd1f2 100%
                );
        }

        /* Soft ışıklar */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(65px);
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 280px;
            height: 280px;
            background: rgba(255, 117, 165, 0.35);
            top: -90px;
            left: -80px;
        }

        body::after {
            width: 360px;
            height: 360px;
            background: rgba(176, 124, 240, 0.28);
            right: -120px;
            bottom: -120px;
        }

        /* Arkadaki transparan soyut çizim */
        .background-shape {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 540px;
            height: 330px;

            transform: translate(-50%, -50%);

            opacity: 0.10;
            pointer-events: none;
            z-index: 1;
        }

        .background-shape::before,
        .background-shape::after {
            content: "";
            position: absolute;

            width: 230px;
            height: 230px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 40% 35%,
                    rgba(255,255,255,0.4),
                    transparent 25%
                ),
                #a63d70;
        }

        .background-shape::before {
            left: 25px;
            top: 42px;
        }

        .background-shape::after {
            right: 25px;
            top: 42px;
        }

        .shape-center {
            position: absolute;

            left: 50%;
            top: 32px;

            width: 75px;
            height: 245px;

            transform: translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(101, 34, 68, 0.75) 0%,
                    rgba(101, 34, 68, 0.35) 60%,
                    transparent 75%
                );
        }

        /* Ana kart */
        .card {
            position: relative;
            z-index: 10;

            width: min(92%, 570px);

            padding: 46px 32px;

            text-align: center;

            background: rgba(255, 255, 255, 0.48);

            border: 1px solid rgba(255, 255, 255, 0.75);

            border-radius: 32px;

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 25px 60px rgba(130, 65, 99, 0.18),
                inset 0 1px 0 rgba(255,255,255,0.85);
        }

        .emoji-top {
            font-size: 58px;
            margin-bottom: 12px;

            animation:
                emojiFloat 2.4s ease-in-out infinite;
        }

        @keyframes emojiFloat {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-7px) rotate(3deg);
            }
        }

        .question {
            margin: 0 auto 36px;

            font-size: clamp(25px, 6vw, 41px);

            line-height: 1.18;

            font-weight: 800;

            letter-spacing: -1px;

            color: #652344;

            text-shadow:
                0 2px 14px rgba(255,255,255,0.7);
        }

        .buttons {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 18px;

            min-height: 65px;
        }

        .btn {
            border: none;
            border-radius: 18px;

            padding: 16px 28px;

            min-width: 135px;

            font-family: "Poppins", sans-serif;

            font-size: 17px;
            font-weight: 700;

            color: white;

            cursor: pointer;

            user-select: none;
            -webkit-tap-highlight-color: transparent;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        /* EVET */
        #yes {
            background:
                linear-gradient(
                    135deg,
                    #ff6697,
                    #e83e79
                );

            box-shadow:
                0 10px 25px rgba(232, 62, 121, 0.28),
                inset 0 1px 0 rgba(255,255,255,0.4);
        }

        #yes:hover {
            transform: translateY(-3px) scale(1.04);

            box-shadow:
                0 15px 32px rgba(232, 62, 121, 0.38),
                inset 0 1px 0 rgba(255,255,255,0.45);
        }

        /* HAYIR */
        #no {
            position: fixed;

            background:
                linear-gradient(
                    135deg,
                    #9c88e9,
                    #7462ca
                );

            box-shadow:
                0 10px 25px rgba(117, 98, 204, 0.25),
                inset 0 1px 0 rgba(255,255,255,0.35);

            z-index: 9999;
        }

        #no:hover {
            transform: translateY(-2px);
        }

        #message {
            min-height: 45px;

            margin-top: 28px;

            font-size: 21px;
            font-weight: 700;

            color: #74284d;
        }

        /* Konfeti */
        .confetti {
            position: fixed;

            top: -30px;

            border-radius: 3px;

            pointer-events: none;

            z-index: 100000;

            animation:
                confettiFall var(--duration) linear forwards;
        }

        @keyframes confettiFall {
            from {
                transform:
                    translate3d(0, 0, 0)
                    rotate(0deg);
            }

            to {
                transform:
                    translate3d(var(--drift), 110vh, 0)
                    rotate(900deg);
            }
        }

        /* Gülen emojiler */
        .laughing {
            position: fixed;

            bottom: -50px;

            pointer-events: none;

            z-index: 99998;

            animation:
                laughRise var(--duration) ease-out forwards;
        }

        @keyframes laughRise {
            0% {
                transform:
                    translate3d(0, 0, 0)
                    rotate(0deg)
                    scale(0.5);

                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            100% {
                transform:
                    translate3d(var(--side), -115vh, 0)
                    rotate(360deg)
                    scale(1.2);

                opacity: 0;
            }
        }

        /* Parıltılar */
        .sparkle {
            position: fixed;

            pointer-events: none;

            z-index: 99997;

            animation:
                sparkleOut 1.5s ease-out forwards;
        }

        @keyframes sparkleOut {
            0% {
                transform:
                    translate3d(0, 0, 0)
                    scale(0.4)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            100% {
                transform:
                    translate3d(var(--x), var(--y), 0)
                    scale(1.2)
                    rotate(200deg);

                opacity: 0;
            }
        }

        @media (max-width: 600px) {

            .card {
                width: 92%;
                padding: 38px 20px;
            }

            .emoji-top {
                font-size: 50px;
            }

            .question {
                font-size: 29px;
                margin-bottom: 30px;
            }

            .buttons {
                gap: 12px;
            }

            .btn {
                min-width: 120px;
                padding: 14px 20px;
                font-size: 16px;
            }

            .background-shape {
                width: 390px;
                height: 250px;
                opacity: 0.075;
            }
        }
    </style>
</head>

<body>

    <div class="background-shape">
        <div class="shape-center"></div>
    </div>

    <div class="card">

        <div class="emoji-top">😏</div>

        <div class="question">
            Götümü yalamak ister misin?
        </div>

        <div class="buttons">

            <button
                class="btn"
                id="yes"
                type="button">
                Evet ❤️
            </button>

            <button
                class="btn"
                id="no"
                type="button">
                Hayır 🙃
            </button>

        </div>

        <div id="message"></div>

    </div>

    <script>

        const yesButton =
            document.getElementById("yes");

        const noButton =
            document.getElementById("no");

        const message =
            document.getElementById("message");


        /* =========================
           HAYIR BUTONUNU BODY'YE AL
        ========================= */

        document.body.appendChild(noButton);


        /* İlk konum */
        function setInitialNoPosition() {

            const yesRect =
                yesButton.getBoundingClientRect();

            const buttonWidth =
                noButton.offsetWidth;

            const buttonHeight =
                noButton.offsetHeight;

            let x =
                yesRect.right + 18;

            let y =
                yesRect.top;

            if (
                x + buttonWidth >
                window.innerWidth - 10
            ) {
                x =
                    yesRect.left - buttonWidth - 18;
            }

            if (x < 10) {
                x = 10;
            }

            if (
                y + buttonHeight >
                window.innerHeight - 10
            ) {
                y =
                    window.innerHeight -
                    buttonHeight -
                    10;
            }

            if (y < 10) {
                y = 10;
            }

            noButton.style.left =
                x + "px";

            noButton.style.top =
                y + "px";
        }


        /* =========================
           HAYIR BUTONUNU KAÇIR
        ========================= */

        function moveNoButton() {

            const margin = 12;

            const buttonWidth =
                noButton.offsetWidth;

            const buttonHeight =
                noButton.offsetHeight;

            const availableWidth =
                window.innerWidth -
                buttonWidth -
                margin * 2;

            const availableHeight =
                window.innerHeight -
                buttonHeight -
                margin * 2;

            const x =
                margin +
                Math.random() *
                Math.max(1, availableWidth);

            const y =
                margin +
                Math.random() *
                Math.max(1, availableHeight);

            noButton.style.position =
                "fixed";

            noButton.style.left =
                Math.min(
                    x,
                    window.innerWidth -
                    buttonWidth -
                    margin
                ) + "px";

            noButton.style.top =
                Math.min(
                    y,
                    window.innerHeight -
                    buttonHeight -
                    margin
                ) + "px";

            noButton.style.display =
                "block";

            noButton.style.visibility =
                "visible";

            noButton.style.opacity =
                "1";

            noButton.style.zIndex =
                "99999";

            noButton.style.transform =
                "none";
        }


        /* Sadece basınca kaç */
        noButton.addEventListener(
            "pointerdown",
            function(event) {

                event.preventDefault();

                event.stopPropagation();

                moveNoButton();
            }
        );


        /* Ekran boyutu değişirse tekrar güvenli yere */
        window.addEventListener(
            "resize",
            function() {

                const rect =
                    noButton.getBoundingClientRect();

                const margin = 12;

                if (
                    rect.right > window.innerWidth ||
                    rect.bottom > window.innerHeight ||
                    rect.left < 0 ||
                    rect.top < 0
                ) {
                    moveNoButton();
                }
            }
        );


        /* =========================
           EVET
        ========================= */

        yesButton.addEventListener(
            "click",
            function() {

                message.textContent =
                    "hıhıhıhıh gıdıklandım 😂";

                createConfetti();

                createLaughingEmojis();

                createSparkles();
            }
        );


        /* =========================
           KONFETİ
        ========================= */

        function createConfetti() {

            const colors = [
                "#ff4f8b",
                "#ff86ad",
                "#c77dff",
                "#8e7dff",
                "#ffffff",
                "#ffc857"
            ];

            for (
                let i = 0;
                i < 150;
                i++
            ) {

                const piece =
                    document.createElement("div");

                piece.className =
                    "confetti";

                piece.style.left =
                    Math.random() * 100 + "vw";

                piece.style.background =
                    colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                    ];

                piece.style.width =
                    6 +
                    Math.random() * 7 +
                    "px";

                piece.style.height =
                    10 +
                    Math.random() * 13 +
                    "px";

                piece.style.setProperty(
                    "--drift",
                    Math.random() * 300 - 150 + "px"
                );

                piece.style.setProperty(
                    "--duration",
                    2 +
                    Math.random() * 3 +
                    "s"
                );

                document.body.appendChild(piece);

                setTimeout(
                    function() {
                        piece.remove();
                    },
                    5500
                );
            }
        }


        /* =========================
           GÜLEN EMOJİLER
        ========================= */

        function createLaughingEmojis() {

            const emojis = [
                "😂",
                "🤣",
                "😆",
                "😹",
                "🤭",
                "😁"
            ];

            for (
                let i = 0;
                i < 20;
                i++
            ) {

                const emoji =
                    document.createElement("div");

                emoji.className =
                    "laughing";

                emoji.textContent =
                    emojis[
                        Math.floor(
                            Math.random() *
                            emojis.length
                        )
                    ];

                emoji.style.left =
                    Math.random() * 100 + "vw";

                emoji.style.fontSize =
                    24 +
                    Math.random() * 24 +
                    "px";

                emoji.style.setProperty(
                    "--side",
                    Math.random() * 220 - 110 + "px"
                );

                emoji.style.setProperty(
                    "--duration",
                    3 +
                    Math.random() * 3 +
                    "s"
                );

                document.body.appendChild(emoji);

                setTimeout(
                    function() {
                        emoji.remove();
                    },
                    7000
                );
            }
        }


        /* =========================
           PARILTI
        ========================= */

        function createSparkles() {

            const symbols = [
                "✨",
                "💖",
                "💕",
                "⭐",
                "💗"
            ];

            for (
                let i = 0;
                i < 28;
                i++
            ) {

                const sparkle =
                    document.createElement("div");

                sparkle.className =
                    "sparkle";

                sparkle.textContent =
                    symbols[
                        Math.floor(
                            Math.random() *
                            symbols.length
                        )
                    ];

                sparkle.style.left =
                    "50%";

                sparkle.style.top =
                    "50%";

                sparkle.style.setProperty(
                    "--x",
                    Math.random() * 700 - 350 + "px"
                );

                sparkle.style.setProperty(
                    "--y",
                    Math.random() * 500 - 250 + "px"
                );

                sparkle.style.fontSize =
                    12 +
                    Math.random() * 22 +
                    "px";

                document.body.appendChild(sparkle);

                setTimeout(
                    function() {
                        sparkle.remove();
                    },
                    1700
                );
            }
        }


        /* İlk konumu sayfa tamamen açıldıktan sonra ayarla */
        window.addEventListener(
            "load",
            function() {
                setTimeout(
                    setInitialNoPosition,
                    100
                );
            }
        );

    </script>

</body>
</html>
